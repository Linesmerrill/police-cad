name: E2E Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  e2e:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout police-cad
        uses: actions/checkout@v4
        with:
          path: police-cad

      - name: Resolve police-cad-api branch
        id: api-branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          if [ -n "$HEAD_REF" ] && gh api "repos/Linesmerrill/police-cad-api/branches/$HEAD_REF" >/dev/null 2>&1; then
            echo "ref=$HEAD_REF" >> "$GITHUB_OUTPUT"
            echo "Using matching police-cad-api branch: $HEAD_REF"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
            echo "No matching police-cad-api branch for '$HEAD_REF', using main"
          fi

      - name: Checkout police-cad-api
        uses: actions/checkout@v4
        with:
          repository: Linesmerrill/police-cad-api
          path: police-cad-api
          ref: ${{ steps.api-branch.outputs.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Start test services (MongoDB + API)
        working-directory: police-cad
        run: docker compose -f docker-compose.test.yml up -d --wait --wait-timeout 60

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: police-cad/package-lock.json

      - name: Install dependencies and build
        working-directory: police-cad
        run: npm ci
        env:
          NEXT_PUBLIC_POLICE_CAD_API_URL: http://localhost:8081

      - name: Install Playwright browsers
        working-directory: police-cad
        run: npx playwright install --with-deps chromium

      - name: Start website
        working-directory: police-cad
        run: |
          node server.js > /tmp/server.log 2>&1 &
          SERVER_PID=$!
          sleep 3
          if ! kill -0 $SERVER_PID 2>/dev/null; then
            echo "::error::Server failed to start"
            cat /tmp/server.log
            exit 1
          fi
          echo "Server started (PID $SERVER_PID)"
        env:
          PORT: 8080
          DB_URI: mongodb://localhost:27018/policecad_test
          POLICE_CAD_API_URL: http://localhost:8081
          POLICE_CAD_API_TOKEN: e2e-placeholder-token
          NODE_ENV: production
          RATE_LIMIT_MAX: "10000"

      - name: Wait for services
        working-directory: police-cad
        run: npx wait-on http://localhost:8080 http://localhost:8081/health --timeout 90000 --interval 2000

      - name: Run Playwright tests
        working-directory: police-cad
        run: npx playwright test
        env:
          CI: true
          BASE_URL: http://localhost:8080
          DB_URI: mongodb://localhost:27018
          DB_NAME: policecad_test
          TEST_USER_EMAIL: testuser@test.com
          TEST_USER_PASSWORD: TestPass123!

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: police-cad/e2e/playwright-report/
          retention-days: 7

      - name: Stop test services
        if: always()
        working-directory: police-cad
        run: docker compose -f docker-compose.test.yml down
